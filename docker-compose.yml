services:
  db:
    image: postgres:16-alpine
    environment:
      # Credenciais apenas de desenvolvimento.
      POSTGRES_USER: leo
      POSTGRES_PASSWORD: leo
      POSTGRES_DB: apifoundation
    ports:
      # 5434 no host: evita conflito com outro PostgreSQL já rodando na máquina (porta padrão 5432).
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leo -d apifoundation"]
      interval: 5s
      timeout: 3s
      retries: 10
